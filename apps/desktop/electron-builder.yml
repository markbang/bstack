appId: com.bstack.desktop
productName: bstack
directories:
  buildResources: build
files:
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!uno.config.ts"
  - "!tsconfig.json"
  - "!tsconfig.node.json"
  - "!tsconfig.web.json"
  - "!.turbo/*"
  - "!*.tsbuildinfo"
  - "!{.env,.env.*,.npmrc,README.md}"
win:
  executableName: bstack
nsis:
  artifactName: bstack-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
  notarize: false
dmg:
  artifactName: bstack-${version}.${ext}
linux:
  executableName: bstack
  target:
    - AppImage
    - deb
  maintainer: bstack <maintainer@example.com>
  category: Utility
appImage:
  artifactName: bstack-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
